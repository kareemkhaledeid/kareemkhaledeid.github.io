<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KLS Mobile Upload Fix</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b10;color:#f4f8fb;font-family:system-ui}.top{padding:14px 16px;background:#0d141d;border-bottom:1px solid #26384b;display:flex;justify-content:space-between}.wrap{max-width:1000px;margin:auto;padding:14px}.hero{text-align:center}.muted{color:#91a3b8}.upload{border:1px dashed #4b7894;background:#0e1721;border-radius:14px;padding:16px;text-align:center}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.pick{display:block;padding:12px;background:#174764;border:1px solid #3e7897;border-radius:9px;color:white;text-decoration:none;cursor:pointer}.pick.alt{background:#142330}.hidden{position:absolute;left:-9999px;width:1px;height:1px;opacity:.01}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.card{background:#0f1620;border:1px solid #26384b;border-radius:10px;padding:10px;margin-top:10px}.chip{display:inline-block;border:1px solid #6c5727;color:#ffd16c;border-radius:999px;padding:3px 6px;font-size:11px}.good{border-color:#347653;color:#7ee39f}.bad{border-color:#8b3f3f;color:#ff9a9a}.preview{max-width:100%;max-height:280px;border-radius:8px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.field label{display:block;color:#91a3b8;font-size:11px}.field input,.field select,.field textarea{width:100%;background:#091018;color:#fff;border:1px solid #26384b;border-radius:7px;padding:9px}.field textarea{min-height:70px}.btn{padding:11px 13px;background:#174764;color:#fff;border:1px solid #3e7897;border-radius:9px}.canvas{width:100%;height:380px;background:#081018;border:1px solid #26384b;border-radius:10px}.small{font-size:11px;color:#91a3b8}@media(max-width:700px){.status,.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.wrap{padding:10px}.hero h1{font-size:24px}}
</style></head><body><div class="top"><b>KLS — Kareem Lighting System</b><span class="chip good">MOBILE FIX</span></div><main class="wrap"><section class="hero"><h1>Upload Your Space</h1><p class="muted">iPhone / Safari compatible file handling</p></section>
<section class="upload"><div class="actions"><label class="pick" for="pdfFile">Upload PDF</label><label class="pick" for="dxfFile">Upload DXF</label><label class="pick" for="imgFile">Upload Floor Plan Image</label><label class="pick alt" for="camFile">Take Photo</label><label class="pick alt" for="iesFile">Upload IES / LDT</label></div><input id="pdfFile" class="hidden" type="file" accept="application/pdf,.pdf"><input id="dxfFile" class="hidden" type="file" accept=".dxf,text/plain"><input id="imgFile" class="hidden" type="file" accept="image/*"><input id="camFile" class="hidden" type="file" accept="image/*" capture="environment"><input id="iesFile" class="hidden" type="file" accept=".ies,.ldt,text/plain"><div class="status"><div class="card"><small>File</small><div id="name">None</div><span id="state" class="chip">NOT LOADED</span></div><div class="card"><small>Type</small><div id="type">—</div></div><div class="card"><small>Geometry</small><div id="geom">Manual dimensions</div></div></div><img id="preview" class="preview" hidden><div id="feedback" class="small"></div></section>
<section class="card"><div class="field"><label>Project type</label><select id="mode"><option>Exhibition</option><option>Theatre</option><option>Live Event</option><option>Film & Photography</option><option>Hybrid</option></select></div><div class="field"><label>Brief</label><textarea id="brief" placeholder="Describe your lighting idea..."></textarea></div><div class="grid"><div class="field"><label>Width m</label><input id="w" type="number" value="12" step=".01"></div><div class="field"><label>Depth m</label><input id="d" type="number" value="8" step=".01"></div><div class="field"><label>Height m</label><input id="h" type="number" value="4" step=".01"></div><div class="field"><label>Target lux</label><input id="lux" type="number" value="150"></div></div><p><label><input id="approve" type="checkbox"> I reviewed the dimensions.</label></p><button id="generate" class="btn">Generate Lighting Plan</button></section><section class="card"><canvas id="cv" class="canvas"></canvas><p id="result" class="small">Upload a file, review dimensions, then generate.</p></section></main><script>
const $=id=>document.getElementById(id);let under=null,geometry=null,project=null;function status(file,state,type,geom,ok=true){$("name").textContent=file?.name||"None";$("state").textContent=state;$("state").className="chip "+(ok?"good":"bad");$("type").textContent=type;$("geom").textContent=geom}function handleImage(file){let u=URL.createObjectURL(file),im=new Image();im.onload=()=>{under=im;$("preview").src=u;$("preview").hidden=false;$("feedback").textContent="Image loaded inside KLS. Confirm the real width/depth before generation.";status(file,"IMAGE LOADED",file.type||"Image","Underlay / manual scale",true);draw()};im.onerror=()=>status(file,"READ ERROR","Image","Could not decode image",false);im.src=u}function parseDXF(text){let a=text.replace(/\r/g,"").split("\n"),p=[];for(let i=0;i<a.length-1;i+=2)p.push([+a[i].trim(),a[i+1].trim()]);let pts=[],x1,y1,x2,y2;for(let i=0;i<p.length;i++){let[c,v]=p[i];if(c===10)x1=+v;if(c===20)y1=+v;if(c===11)x2=+v;if(c===21)y2=+v;if(x1!=null&&y1!=null&&x2!=null&&y2!=null){pts.push([x1,y1],[x2,y2]);x1=y1=x2=y2=null}}if(!pts.length)throw Error("No LINE geometry found");let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),W=Math.max(...xs)-Math.min(...xs),D=Math.max(...ys)-Math.min(...ys),s=W>100?0.001:1;return{w:W*s,d:D*s,count:pts.length/2}}function handleDXF(file){let r=new FileReader();r.onload=()=>{try{geometry=parseDXF(String(r.result));$("w").value=geometry.w.toFixed(2);$("d").value=geometry.d.toFixed(2);$("feedback").textContent=`DXF read: ${geometry.count} line entities. Review detected units/dimensions.`;status(file,"DXF READ","DXF","Detected geometry / review",true)}catch(e){status(file,"READ ERROR","DXF",e.message,false)}};r.onerror=()=>status(file,"READ ERROR","DXF","FileReader failed",false);r.readAsText(file)}function handlePDF(file){$("preview").hidden=true;$("feedback").textContent="PDF loaded successfully. This static version stores the selection but does not yet extract reliable vector geometry; confirm dimensions manually.";status(file,"PDF LOADED","PDF","Manual scale required",true)}function handleIES(file){let r=new FileReader();r.onload=()=>{let t=String(r.result),ext=file.name.split(".").pop().toLowerCase();if(ext==="ies"){let ok=t.toUpperCase().includes("TILT=");$("feedback").textContent=ok?"IES file loaded and recognized.":"IES selected but structure needs review.";status(file,ok?"IES LOADED":"IES REVIEW","IES","Photometry file",ok)}else{status(file,"LDT LOADED","LDT","Photometry file",true);$("feedback").textContent="LDT file loaded. Parsing will be added to the calculation engine."}};r.readAsText(file)}function bind(id,fn){$(id).addEventListener("change",e=>{let f=e.target.files&&e.target.files[0];if(f)fn(f);e.target.value=""})}bind("pdfFile",handlePDF);bind("dxfFile",handleDXF);bind("imgFile",handleImage);bind("camFile",handleImage);bind("iesFile",handleIES);$("generate").addEventListener("click",()=>{if(!$("approve").checked)return alert("Review and approve dimensions first.");let W=+$("w").value||12,D=+$("d").value||8,H=+$("h").value||4,n=Math.max(4,Math.ceil(W*D/18)),cols=Math.ceil(Math.sqrt(n*W/D)),rows=Math.ceil(n/cols),F=[],id=1;for(let j=0;j<rows&&id<=n;j++)for(let i=0;i<cols&&id<=n;i++){let x=(i+.5)*W/cols,y=(j+.5)*D/rows;F.push({id:"F"+id++,x,y,tx:W/2+(x-W/2)*.6,ty:D/2+(y-D/2)*.6})}project={w:W,d:D,h:H,fixtures:F};draw();$("result").textContent=`Generated ${F.length} fixtures. Planning geometry is ${geometry?"DXF-based":"manual/reviewed"}.`});function draw(){let c=$("cv"),r=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*r;c.height=H*r;let q=c.getContext("2d");q.setTransform(r,0,0,r,0,0);q.clearRect(0,0,W,H);if(!project){q.fillStyle="#91a3b8";q.font="14px system-ui";q.fillText("Waiting for generated plan…",20,30);return}let s=Math.min((W-40)/project.w,(H-40)/project.d),ox=(W-project.w*s)/2,oy=(H-project.d*s)/2;if(under){q.globalAlpha=.25;q.drawImage(under,ox,oy,project.w*s,project.d*s);q.globalAlpha=1}q.strokeStyle="#52697c";q.strokeRect(ox,oy,project.w*s,project.d*s);project.fixtures.forEach(f=>{q.strokeStyle="#365f77";q.beginPath();q.moveTo(ox+f.x*s,oy+f.y*s);q.lineTo(ox+f.tx*s,oy+f.ty*s);q.stroke();q.fillStyle="#75d7ff";q.beginPath();q.arc(ox+f.x*s,oy+f.y*s,4,0,7);q.fill();q.fillStyle="#fff";q.font="9px Arial";q.fillText(f.id,ox+f.x*s+5,oy+f.y*s-4)})}window.addEventListener("resize",draw);draw();
</script></body></html>
